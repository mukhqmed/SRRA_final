---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app}
spec:
  replicas: 4                       # R = 4 (вариант 29)
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "/code/core.py"]
        env:
        - {name: DEP_URL, value: "http://dep-a"}     # основная зависимость
        - {name: DEP_URL_B, value: "http://dep-b"}   # для failover / hedging / голосования
        - {name: DEP_URL_C, value: "http://dep-c"}   # для голосования 2 из 3
        - {name: PATTERN, value: "off"}
        # Пороги паттерна варианта 29 (Bulkhead + приоритет аварийных команд)
        - {name: NORMAL_LIMIT, value: "8"}           # потоков в обычном отсеке на реплику
        - {name: EMERGENCY_LIMIT, value: "4"}        # потоков в аварийном отсеке на реплику
        - {name: NORMAL_TIMEOUT_S, value: "0.8"}
        - {name: EMERGENCY_TIMEOUT_S, value: "0.5"}
        - {name: EMERGENCY_EVERY, value: "10"}       # доля аварийных команд в трафике = 1/10
        readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 2}
        livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
        volumeMounts: [{name: code, mountPath: /code}]
      volumes: [{name: code, configMap: {name: code}}]
---
apiVersion: v1
kind: Service
metadata: {name: app-svc}
spec: {selector: {app: app}, ports: [{port: 80, targetPort: 8080}]}
