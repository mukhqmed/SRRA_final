apiVersion: apps/v1
kind: Deployment
metadata: {name: dep-a}
spec:
  replicas: 1
  selector: {matchLabels: {app: dep-a}}
  template:
    metadata: {labels: {app: dep-a}}
    spec:
      containers:
      - name: dep
        image: python:3.12-alpine
        command: ["python", "/code/dep.py"]
        env: [{name: NAME, value: dep-a}]
        volumeMounts: [{name: code, mountPath: /code}]
      volumes: [{name: code, configMap: {name: code}}]
---
apiVersion: v1
kind: Service
metadata: {name: dep-a}
spec: {selector: {app: dep-a}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dep-b}
spec:
  replicas: 1
  selector: {matchLabels: {app: dep-b}}
  template:
    metadata: {labels: {app: dep-b}}
